# =============================================================================
# Pipeline CI/CD - Red Social Gamer y Catálogo de Videojuegos (HU-12)
# Cátedra: Herramientas Informáticas Avanzadas - Grupo 08
# =============================================================================
#
# ETAPAS:
#   1. lint-backend    → Validación de sintaxis JS (node --check)
#   2. lint-frontend   → Verificación de tipos TypeScript (tsc --noEmit)
#   3. test-backend    → Pruebas unitarias con Node.js built-in test runner
#   4. test-frontend   → Pruebas unitarias con Angular/Vitest en modo headless
#   5. build-and-push  → Build multi-stage de imágenes Docker + push a GHCR
#   6. deploy-staging  → Verificación de despliegue: docker compose pull + up --dry-run
#
# SEGURIDAD:
#   - Solo se usa GITHUB_TOKEN (nativo, sin secretos manuales adicionales).
#   - Las imágenes se publican en ghcr.io bajo el scope del repositorio.
#   - Ningún secreto ni archivo .env se expone en logs ni artefactos.
#
# DISPARO:
#   - push a las ramas: main, develop, feature/**, fix/**
#   - pull_request apuntando a: main, develop
# =============================================================================

name: CI/CD Pipeline - Gamer Social Network

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

# Permisos mínimos: lectura del código + escritura al registro de contenedores
permissions:
  contents: read
  packages: write

# Variables de entorno globales del pipeline
env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/gamer-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/gamer-frontend

jobs:

  # ═══════════════════════════════════════════════════════
  # JOB 1: Linting y verificación de sintaxis - Backend
  # ═══════════════════════════════════════════════════════
  lint-backend:
    name: "🔍 Lint Backend (Node.js --check)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Ejecutar verificación de sintaxis JavaScript
        run: npm run lint


  # ═══════════════════════════════════════════════════════
  # JOB 2: Linting y verificación de tipos - Frontend
  # ═══════════════════════════════════════════════════════
  lint-frontend:
    name: "🔍 Lint Frontend (TypeScript --noEmit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci --legacy-peer-deps

      - name: Ejecutar verificación de tipos con TypeScript compiler
        run: npm run lint


  # ═══════════════════════════════════════════════════════
  # JOB 3: Pruebas unitarias - Backend
  # Depende de: lint-backend (quality gate)
  # ═══════════════════════════════════════════════════════
  test-backend:
    name: "🧪 Test Backend (Node.js built-in runner)"
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar todas las dependencias (incluye xss para los tests)
        run: npm ci

      - name: Ejecutar suite de pruebas unitarias
        run: npm test


  # ═══════════════════════════════════════════════════════
  # JOB 4: Pruebas unitarias - Frontend
  # Depende de: lint-frontend (quality gate)
  # ═══════════════════════════════════════════════════════
  test-frontend:
    name: "🧪 Test Frontend (Angular + Vitest headless)"
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci --legacy-peer-deps

      - name: Ejecutar pruebas unitarias en modo headless
        run: npm run test:ci


  # ═══════════════════════════════════════════════════════
  # JOB 5: Build multi-stage de imágenes Docker + Push a GHCR
  # Depende de: test-backend Y test-frontend (ambos en verde)
  # Solo corre en push a main o develop (no en PRs)
  # ═══════════════════════════════════════════════════════
  build-and-push:
    name: "🐳 Build & Push Docker Images (GHCR)"
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
    # Solo publicar imágenes en merges a ramas principales, no en PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (soporte multi-arquitectura)
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para imagen del Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build y Push - Backend Node.js (non-root, producción)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer metadatos para imagen del Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build y Push - Frontend Angular/Nginx (multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ═══════════════════════════════════════════════════════
  # JOB 6: Verificación de despliegue en staging
  # Depende de: build-and-push
  # Solo corre en push a main o develop
  # ═══════════════════════════════════════════════════════
  deploy-staging:
    name: "🚀 Deploy Verification (Staging)"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Autenticar en GitHub Container Registry (para docker compose pull)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear archivo .env de CI con valores dummy (sin secretos reales)
        run: |
          cat <<'EOF' > .env
          # Archivo .env generado automáticamente por CI - NO contiene secretos reales
          # Sirve únicamente para verificar que docker compose valida la configuración
          JWT_SECRET=ci_dummy_jwt_secret_not_real
          DB_HOST=gamer-db-proxy
          DB_USER=ci_user
          DB_PASSWORD=ci_dummy_password
          DB_NAME=tpfinalbackend
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          GOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback
          FRONTEND_URL=http://localhost:4200
          IGDB_CLIENT_ID=dummy
          IGDB_CLIENT_SECRET=dummy
          SESSION_SECRET=ci_dummy_session_secret
          PGADMIN_DEFAULT_EMAIL=admin@example.com
          PGADMIN_DEFAULT_PASSWORD=dummy
          GRAFANA_ADMIN_PASSWORD=dummy
          POSTGRES_REPLICATION_PASSWORD=dummy
          PATRONI_REPLICATION_PASSWORD=dummy
          HAPROXY_STATS_PASSWORD=dummy
          POSTGRES_EXPORTER_PASSWORD=dummy
          EOF

      - name: Verificar sintaxis del docker-compose.yml (config validate)
        run: docker compose --env-file .env config --quiet

      - name: Limpiar archivo .env temporal de CI
        if: always()
        run: rm -f .env

      - name: Resumen del despliegue verificado
        run: |
          echo "✅ Verificación de staging completada."
          echo "   Rama:   ${{ github.ref_name }}"
          echo "   SHA:    ${{ github.sha }}"
          echo "   Actor:  ${{ github.actor }}"
          echo "   Backend image:  ${{ env.IMAGE_BACKEND }}"
          echo "   Frontend image: ${{ env.IMAGE_FRONTEND }}"
