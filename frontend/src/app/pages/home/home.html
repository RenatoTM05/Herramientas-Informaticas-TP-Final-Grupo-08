<main class="catalog">
  <section class="hero" aria-labelledby="catalog-title">
    <div class="hero-copy">
      <h1 id="catalog-title">Explorá<br />el catálogo<span>.</span></h1>

      <div class="game-search" role="search" aria-label="Catálogo de videojuegos">
        <div class="search-controls">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input
            #inputBuscador
            type="text"
            placeholder="Buscá por título"
            aria-label="Buscar juegos por título"
            (keyup.enter)="irAResultados(inputBuscador.value)"
            (keyup)="buscarSugerencias(inputBuscador.value)"
          />
          <button class="primary-button" type="button" (click)="irAResultados(inputBuscador.value)">
            Buscar
          </button>
        </div>

        <ul *ngIf="mostrarSugerencias && sugerenciasBusqueda.length > 0" class="suggestions">
          <li *ngFor="let sugerencia of sugerenciasBusqueda">
            <button type="button" class="suggestion" (click)="seleccionarSugerencia(sugerencia)">
              <span class="suggestion-cover overflow-hidden rounded">
                <img *ngIf="sugerencia.imagen_portada" [src]="sugerencia.imagen_portada" alt="" />
              </span>
              <span class="suggestion-text">
                <strong class="d-block">{{ sugerencia.titulo }}</strong>
                <small class="d-block">{{
                  sugerencia.generos
                    ? (sugerencia.generos | slice: 0 : 3).join(', ')
                    : 'Sin clasificar'
                }}</small>
              </span>
              <span class="platforms d-flex flex-wrap gap-2" aria-hidden="true">
                <i
                  *ngFor="let icono of obtenerIconosPlataformas(sugerencia.plataformas)"
                  [class]="'bi ' + icono"
                ></i>
              </span>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div
      *ngIf="juegosDestacados.length > 0"
      id="carruselJuegos"
      class="carousel slide featured"
      data-bs-ride="carousel"
      aria-label="Juegos destacados"
    >
      <div class="carousel-inner">
        <div
          *ngFor="let destacado of juegosDestacados; let i = index"
          class="carousel-item"
          [class.active]="i === 0"
        >
          <button class="featured-game" type="button" (click)="verDetalle(destacado.id)">
            <img
              *ngIf="destacado.imagen_portada"
              [src]="destacado.imagen_portada"
              alt=""
              class="featured-art"
            />
            <span class="featured-copy">
              <small>Destacado</small>
              <strong>{{ destacado.titulo }}</strong>
              <span *ngIf="destacado.descuento || destacado.precio">
                {{ destacado.descuento }} {{ destacado.precio }}
              </span>
            </span>
          </button>
        </div>
      </div>

      <div class="featured-controls" *ngIf="juegosDestacados.length > 1">
        <button
          type="button"
          data-bs-target="#carruselJuegos"
          data-bs-slide="prev"
          aria-label="Destacado anterior"
        >
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-bs-target="#carruselJuegos"
          data-bs-slide="next"
          aria-label="Destacado siguiente"
        >
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </section>

  <section
    class="catalog-section"
    aria-labelledby="popular-title"
    *ngIf="catalogoGeneral.length > 0"
  >
    <h2 id="popular-title">Más jugados este mes</h2>

    <div class="game-grid">
      <button
        class="game-card"
        type="button"
        *ngFor="let juego of catalogoGeneral"
        (click)="verDetalle(juego.id)"
      >
        <span class="game-art">
          <img *ngIf="juego.imagen_portada" [src]="juego.imagen_portada" alt="" loading="lazy" />
        </span>
        <span class="game-info">
          <strong>{{ juego.titulo }}</strong>
          <small class="d-block">{{
            juego.generos?.length ? juego.generos.join(', ') : 'Varios'
          }}</small>
          <span
            class="platforms d-flex flex-wrap gap-2"
            [attr.aria-label]="juego.plataformas?.join(', ')"
          >
            <i
              *ngFor="let icono of obtenerIconosPlataformas(juego.plataformas)"
              [class]="'bi ' + icono"
              aria-hidden="true"
            ></i>
          </span>
        </span>
      </button>
    </div>
  </section>
</main>
