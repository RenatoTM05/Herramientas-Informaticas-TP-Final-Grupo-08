<main class="results">
  <header class="results-header">
    <a class="back-link" routerLink="/"
      ><i class="bi bi-arrow-left" aria-hidden="true"></i> Catálogo</a
    >
    <h1>
      <ng-container *ngIf="terminoBusqueda; else busquedaPorFiltros">
        Resultados para <span>«{{ terminoBusqueda }}»</span>
      </ng-container>
      <ng-template #busquedaPorFiltros>Búsqueda por filtros</ng-template>
    </h1>
  </header>

  <div class="results-layout">
    <aside class="filters" aria-labelledby="filters-title">
      <h2 id="filters-title"><i class="bi bi-sliders" aria-hidden="true"></i> Filtros</h2>

      <div class="filter-fields">
        <label class="field">
          <span>Desarrolladora</span>
          <input type="text" [(ngModel)]="desarrolladora" placeholder="Ej. Nintendo" />
        </label>

        <fieldset class="rating">
          <legend>Calificación</legend>
          <div class="rating-fields">
            <label class="field">
              <span>Mínima</span>
              <input
                type="number"
                [(ngModel)]="calificacionMin"
                min="0"
                max="100"
                placeholder="0"
              />
            </label>
            <label class="field">
              <span>Máxima</span>
              <input
                type="number"
                [(ngModel)]="calificacionMax"
                min="0"
                max="100"
                placeholder="100"
              />
            </label>
          </div>
        </fieldset>

        <label class="field">
          <span>Ordenar por</span>
          <select [(ngModel)]="orden">
            <option value="titulo">Título</option>
            <option value="calificacion">Calificación</option>
            <option value="fecha_lanzamiento">Fecha de lanzamiento</option>
            <option value="desarrolladora">Desarrolladora</option>
          </select>
        </label>

        <label class="field">
          <span>Dirección</span>
          <select [(ngModel)]="direccion">
            <option value="ASC">Ascendente</option>
            <option value="DESC">Descendente</option>
          </select>
        </label>

        <label class="field">
          <span>Juegos por página</span>
          <select [(ngModel)]="limite" (change)="cambiarLimite()">
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
          </select>
        </label>
      </div>

      <div class="filter-actions">
        <button class="primary-button" type="button" (click)="aplicarFiltros()">
          Aplicar filtros
        </button>
        <button
          class="secondary-button"
          type="button"
          (click)="
            desarrolladora = '';
            calificacionMin = null;
            calificacionMax = null;
            orden = 'titulo';
            direccion = 'ASC';
            aplicarFiltros()
          "
        >
          Limpiar filtros
        </button>
      </div>
    </aside>

    <section class="matches" aria-label="Juegos encontrados" [attr.aria-busy]="cargando">
      <p class="count" *ngIf="!cargando" role="status">
        {{ total }} {{ total === 1 ? 'juego encontrado' : 'juegos encontrados' }}
      </p>

      <div *ngIf="cargando" class="status" role="status">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        Buscando juegos…
      </div>

      <div *ngIf="!cargando && resultados.length === 0" class="status">
        <i class="bi bi-search" aria-hidden="true"></i>
        No encontramos juegos que coincidan con tu búsqueda.
      </div>

      <ul *ngIf="!cargando && resultados.length > 0" class="match-list">
        <li *ngFor="let juego of resultados">
          <button type="button" class="match" (click)="verDetalle(juego.id)">
            <span class="match-cover">
              <img
                *ngIf="juego.imagen_portada"
                [src]="juego.imagen_portada"
                alt=""
                loading="lazy"
              />
            </span>
            <span class="match-copy">
              <strong>{{ juego.titulo }}</strong>
              <span class="match-platforms" [attr.aria-label]="juego.plataformas?.join(', ')">
                <i
                  *ngFor="let icono of obtenerIconosPlataformas(juego.plataformas)"
                  [class]="'bi ' + icono"
                  aria-hidden="true"
                ></i>
              </span>
              <span class="tags" *ngIf="juego.generos?.length">
                <span *ngFor="let genero of juego.generos | slice: 0 : 2">{{ genero }}</span>
              </span>
            </span>
            <span class="match-date">{{
              juego.fecha_lanzamiento
                ? (juego.fecha_lanzamiento | date: 'dd MMM yyyy')
                : 'Próximamente'
            }}</span>
            <i class="bi bi-chevron-right match-arrow" aria-hidden="true"></i>
          </button>
        </li>
      </ul>

      <nav
        *ngIf="!cargando && totalPaginas > 1"
        class="pagination-bar"
        aria-label="Páginas de resultados"
      >
        <button
          class="secondary-button"
          type="button"
          [disabled]="pagina === 1"
          (click)="cambiarPagina(pagina - 1)"
        >
          <i class="bi bi-chevron-left" aria-hidden="true"></i> Anterior
        </button>
        <span>Página {{ pagina }} de {{ totalPaginas }}</span>
        <button
          class="secondary-button"
          type="button"
          [disabled]="pagina === totalPaginas"
          (click)="cambiarPagina(pagina + 1)"
        >
          Siguiente <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </nav>
    </section>
  </div>
</main>
