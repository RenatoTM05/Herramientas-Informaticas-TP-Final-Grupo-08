<nav class="navbar navbar-expand-lg gamer-navbar" aria-label="Navegación principal">
  <div class="nav-shell">
    <a class="navbar-brand gamer-brand" routerLink="/" (click)="menuAbierto = false">
      <span class="brand-mark" aria-hidden="true">G08</span>
      <span>Red Social Gamer</span>
    </a>

    <button
      class="navbar-toggler icon-button"
      type="button"
      aria-controls="navbarNav"
      aria-label="Mostrar u ocultar la navegación"
      [attr.aria-expanded]="menuAbierto"
      (click)="menuAbierto = !menuAbierto"
    >
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <div class="collapse navbar-collapse nav-content" id="navbarNav" [class.show]="menuAbierto">
      <ul class="navbar-nav nav-pages">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            (click)="menuAbierto = false"
          >
            <i class="bi bi-grid" aria-hidden="true"></i>
            Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/Resultados"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="menuAbierto = false"
          >
            <i class="bi bi-sliders" aria-hidden="true"></i>
            Búsqueda por filtros
          </a>
        </li>
        <li
          class="nav-item"
          *ngIf="
            usuarioAutenticado && (usuarioActual.rol === 'critico' || usuarioActual.rol === 'admin')
          "
        >
          <a
            class="nav-link"
            routerLink="/Tienda"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="menuAbierto = false"
            >Tienda</a
          >
        </li>
        <li class="nav-item" *ngIf="usuarioAutenticado && usuarioActual.rol === 'admin'">
          <a
            class="nav-link"
            routerLink="/Admin"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="menuAbierto = false"
            >Panel Admin</a
          >
        </li>
      </ul>

      <div class="nav-actions">
        <a
          *ngIf="!usuarioAutenticado"
          class="login-link"
          routerLink="/Login"
          (click)="menuAbierto = false"
        >
          <i class="bi bi-person" aria-hidden="true"></i>
          Iniciar sesión
        </a>

        <ng-container *ngIf="usuarioAutenticado">
          <div class="nav-profile">
            <img [src]="usuarioActual.fotoPerfil" alt="" width="34" height="34" />
            <div class="profile-text">
              <strong [title]="usuarioActual.nombre">{{ usuarioActual.nombre }}</strong>
              <small *ngIf="usuarioActual.rol === 'critico'">Crítico</small>
              <small *ngIf="usuarioActual.rol === 'admin'">Administrador</small>
            </div>
          </div>

          <button type="button" class="logout-button" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            Cerrar sesión
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
