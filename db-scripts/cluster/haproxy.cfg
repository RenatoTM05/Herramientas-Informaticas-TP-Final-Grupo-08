defaults
    mode tcp
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    timeout check 1s

resolvers docker
    nameserver docker 127.0.0.11:53
    hold valid 5s

frontend sql
    bind :5432
    default_backend primary

backend primary
    option httpchk GET /primary
    http-check expect status 200
    default-server init-state fully-down inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 check port 8008 resolvers docker init-addr libc,none
    server pg-node-2 pg-node-2:5432 check port 8008 resolvers docker init-addr libc,none
    server pg-node-3 pg-node-3:5432 check port 8008 resolvers docker init-addr libc,none

frontend readiness
    mode http
    bind :8404
    monitor-uri /health
    monitor fail if { nbsrv(primary) lt 1 }
    http-request use-service prometheus-exporter if { path /metrics }
