x-etcd-environment: &etcd-environment
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
  ETCD_INITIAL_CLUSTER_TOKEN: gamer-postgres

x-etcd-node: &etcd-node
  image: quay.io/coreos/etcd:v3.6.6
  entrypoint: ["/usr/local/bin/etcd"]
  restart: unless-stopped
  networks: [cluster-control]

x-patroni-environment: &patroni-environment
  POSTGRES_DB: ${POSTGRES_DB:-tpfinalbackend}
  PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER:-gamer_admin}
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
  PATRONI_REPLICATION_USERNAME: replicador
  PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:-}
  TZ: ${TZ:-America/Argentina/Buenos_Aires}

x-patroni-node: &patroni-node
  build: ./db-scripts/cluster
  image: gamer-patroni:pg16
  restart: unless-stopped
  stop_grace_period: 30s
  shm_size: 256m
  depends_on: [etcd-1, etcd-2, etcd-3]
  networks: [db-network, cluster-control]

services:
  # ===========================================================================
  # HU-09/10 | Entrada SQL estable. "postgres" es el alias usado por la app.
  # ===========================================================================
  postgres:
    image: haproxy:3.2-alpine
    container_name: gamer-db-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./db-scripts/cluster/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [pg-node-1, pg-node-2, pg-node-3]
    networks: [db-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15m

  # Cada nodo puede asumir el rol de primario. Los números identifican nodos.
  pg-node-1:
    <<: *patroni-node
    container_name: gamer-pg-node-1
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-node-1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-1:8008
    volumes:
      - pg-cluster-node-1:/var/lib/postgresql/data
      - &init-schema ./db-scripts/init/01_schema_init.sql:/sql/01_schema_init.sql:ro
      - &init-seed ./db-scripts/seeders/02_massive_seed_6M.sql:/sql/02_massive_seed_6M.sql:ro
      - &init-indexes ./db-scripts/optimizations/create_indexes.sql:/sql/03_create_indexes.sql:ro

  pg-node-2:
    <<: *patroni-node
    container_name: gamer-pg-node-2
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-node-2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-2:8008
    volumes:
      - pg-cluster-node-2:/var/lib/postgresql/data
      - *init-schema
      - *init-seed
      - *init-indexes

  pg-node-3:
    <<: *patroni-node
    container_name: gamer-pg-node-3
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-node-3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-3:8008
    volumes:
      - pg-cluster-node-3:/var/lib/postgresql/data
      - *init-schema
      - *init-seed
      - *init-indexes

  # etcd guarda el liderazgo. Dos de sus tres miembros forman mayoría.
  etcd-1:
    <<: *etcd-node
    container_name: gamer-etcd-1
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes: [etcd-cluster-node-1:/etcd-data]

  etcd-2:
    <<: *etcd-node
    container_name: gamer-etcd-2
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes: [etcd-cluster-node-2:/etcd-data]

  etcd-3:
    <<: *etcd-node
    container_name: gamer-etcd-3
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes: [etcd-cluster-node-3:/etcd-data]

  # ===========================================================================
  # HU-07 | Respaldos lógicos automáticos de PostgreSQL
  # ===========================================================================
  backups:
    image: postgres:16-bookworm
    user: postgres
    entrypoint: [bash, /scripts/scheduler.sh]
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-gamer_admin}
      PGDATABASE: ${POSTGRES_DB:-tpfinalbackend}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: '5'
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./db-scripts/backups/backup.sh:/scripts/backup.sh:ro
      - ./db-scripts/backups/scheduler.sh:/scripts/scheduler.sh:ro
      - ./db-scripts/backups/restore.sh:/scripts/restore.sh:ro
      - backup-data:/backups
    depends_on:
      backup-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [db-network]
    restart: unless-stopped
    stop_grace_period: 30s

  backup-permissions:
    image: postgres:16-bookworm
    entrypoint: [bash, -c, 'chown postgres:postgres /backups && chmod 700 /backups']
    volumes: [backup-data:/backups]
    network_mode: none

  # ===========================================================================
  # HU-05 | pgAdmin4 - Cliente web de administración de base de datos
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamer_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - db-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # HU-11 | Backend API (Node.js / Express 5) - Ejecución non-root optimizada
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gamer-backend:production
    container_name: gamer_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tpfinalbackend}
      DB_USER: ${POSTGRES_USER:-gamer_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-token_pal_usuario}
      SESSION_SECRET: ${SESSION_SECRET:-session_user}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app-network
      - db-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api-docs/', (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # HU-11 | Frontend Web (Angular 21 / Nginx Alpine) - Multi-stage build
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gamer-frontend:production
    container_name: gamer_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # HU-13 | Tailscale Funnel hacia el frontend
  # Publica HTTPS mediante Funnel, sin abrir puertos entrantes en el router.
  # ===========================================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: gamer_tailscale
    hostname: gamer-frontend-${COMPUTERNAME:-equipo}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app-network

  # ===========================================================================
  # HU-15 | GLPI Database (MariaDB 10.11) - Mesa de Ayuda ITIL
  # ===========================================================================
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${GLPI_DB_NAME:-glpi_db}
      MYSQL_USER: ${GLPI_DB_USER:-glpi_user}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_password_change_me}
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${GLPI_DB_USER:-glpi_user}", "--password=${GLPI_DB_PASSWORD:-glpi_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # HU-15 | GLPI Helpdesk (GLPI 10 Official) - Gestión de Tickets y Autoservicio
  # ===========================================================================
  glpi:
    image: glpi/glpi:latest
    container_name: glpi-app
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - "${GLPI_PORT:-8080}:80"
    environment:
      TIMEZONE: ${TZ:-America/Argentina/Buenos_Aires}
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi_db}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi_user}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_password_change_me}
    volumes:
      - glpi_data:/var/glpi
    networks:
      - glpi-network

    # ===========================================================================
  # HU-17 | Nextcloud Database (PostgreSQL 16) - Base dedicada para documentos
  # ===========================================================================
  nextcloud-db:
    image: postgres:16-alpine
    container_name: gamer_nextcloud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud_db}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud_user}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud_user} -d ${NEXTCLOUD_DB_NAME:-nextcloud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # HU-17 | Nextcloud Server - Repositorio Documental Centralizado
  # ===========================================================================
  nextcloud:
    image: nextcloud:apache
    container_name: gamer_nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_PORT:-8085}:80"
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud_db}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud_user}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin_nextcloud}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud"
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud-network

  # ===========================================================================
  # HU-14 | Observabilidad y Monitoreo (Prometheus, Grafana y Exportadores)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: gamer_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-network

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: gamer_cadvisor
    restart: unless-stopped
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: gamer_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-gamer_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tpfinalbackend}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-network
      - monitoring-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gamer_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring-network
      - db-network
      - app-network
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gamer_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - monitoring-network
    depends_on:
      - prometheus

    # ===========================================================================
  # HU-18 | Alertmanager - Despachador de alertas de Prometheus hacia n8n
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gamer_alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring-network

  # ===========================================================================
  # HU-18 | n8n - Orquestador de Flujos y Automatización Operativa
  # ===========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gamer_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${TZ:-America/Argentina/Buenos_Aires}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-super_secret_encryption_key_grupo08}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - backup-data:/backups:ro
    networks:
      - monitoring-network
      - glpi-network
      - nextcloud-network
      - db-network
    depends_on:
      - prometheus
      - glpi
      - nextcloud

# =============================================================================
# Volúmenes nombrados con persistencia garantizada
# =============================================================================
volumes:
  backup-data:
  pg-cluster-node-1:
  pg-cluster-node-2:
  pg-cluster-node-3:
  etcd-cluster-node-1:
  etcd-cluster-node-2:
  etcd-cluster-node-3:
  pgadmin_data:
    name: gamer_pgadmin_data
  glpi_db_data:
    name: glpi_db_data
  glpi_data:
    name: glpi_data
  tailscale_state:
    name: gamer_tailscale_state
  nextcloud_data:
    name: gamer_nextcloud_data
  nextcloud_db_data:
    name: gamer_nextcloud_db_data
  prometheus_data:
    name: gamer_prometheus_data
  grafana_data:
    name: gamer_grafana_data
  n8n_data:
    name: gamer_n8n_data
  alertmanager_data:
    name: gamer_alertmanager_data

# =============================================================================
# Redes bridge internas segmentadas (Seguridad y Microsegmentación)
# =============================================================================
networks:
  app-network:
    name: gamer_app_network
    driver: bridge
  db-network:
    name: gamer_db_network
    driver: bridge
  cluster-control:
    internal: true
  glpi-network:
    name: glpi-network
    driver: bridge
  nextcloud-network:
    name: gamer_nextcloud_network
    driver: bridge
  monitoring-network:
    name: gamer_monitoring_network
    driver: bridge
