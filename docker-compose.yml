services:
  # ===========================================================================
  # HU-04 | PostgreSQL 16 - Motor Relacional con persistencia y healthcheck
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gamer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tpfinalbackend}
      POSTGRES_USER: ${POSTGRES_USER:-gamer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      # Expuesto solo en localhost para seguridad
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamer_admin} -d ${POSTGRES_DB:-tpfinalbackend}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  # ===========================================================================
  # HU-07 | Respaldos lógicos automáticos de PostgreSQL
  # ===========================================================================
  backups:
    image: postgres:16-bookworm
    user: postgres
    entrypoint: [bash, /scripts/scheduler.sh]
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-gamer_admin}
      PGDATABASE: ${POSTGRES_DB:-tpfinalbackend}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: '5'
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./db-scripts/backups/backup.sh:/scripts/backup.sh:ro
      - ./db-scripts/backups/scheduler.sh:/scripts/scheduler.sh:ro
      - ./db-scripts/backups/restore.sh:/scripts/restore.sh:ro
      - backup-data:/backups
    depends_on:
      backup-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [db-network]
    restart: unless-stopped
    stop_grace_period: 30s

  backup-permissions:
    image: postgres:16-bookworm
    entrypoint: [bash, -c, 'chown postgres:postgres /backups && chmod 700 /backups']
    volumes: [backup-data:/backups]
    network_mode: none

  # ===========================================================================
  # HU-05 | pgAdmin4 - Cliente web de administración de base de datos
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamer_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - db-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # HU-11 | Backend API (Node.js / Express 5) - Ejecución non-root optimizada
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gamer-backend:production
    container_name: gamer_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tpfinalbackend}
      DB_USER: ${POSTGRES_USER:-gamer_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-token_pal_usuario}
      SESSION_SECRET: ${SESSION_SECRET:-session_user}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app-network
      - db-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # HU-06 | Carga masiva automatizada de datos de prueba (6 millones)
  # ===========================================================================
  db-seeder:
    image: postgres:16-alpine
    container_name: gamer_db_seeder
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-gamer_admin}
      PGDATABASE: ${POSTGRES_DB:-tpfinalbackend}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    restart: "no"
    volumes:
      - ./db-scripts/seeders:/seeders:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - db-network
    entrypoint: ["/bin/sh", "-c"]
    command:
     - |
      set -eu

      echo "Verificando si la carga masiva ya fue ejecutada..."

      psql -v ON_ERROR_STOP=1 -c "
        CREATE TABLE IF NOT EXISTS public.seed_runs (
          seed_name VARCHAR(255) PRIMARY KEY,
          executed_at TIMESTAMP DEFAULT NOW()
        );
      "

      already_seeded=$$(psql -X -A -t -v ON_ERROR_STOP=1 -c "
        SELECT EXISTS (
          SELECT 1 FROM public.seed_runs
          WHERE seed_name = '02_massive_seed_6M.sql'
        );
      " | tr -d '[:space:]')

      if [ "$$already_seeded" = "t" ]; then
        echo "La carga masiva ya fue realizada. No se repetirá."
        exit 0
      fi

      echo "Iniciando carga masiva de datos..."

      psql -X -v ON_ERROR_STOP=1 \
        -f /seeders/02_massive_seed_6M.sql

      psql -v ON_ERROR_STOP=1 -c "
        INSERT INTO public.seed_runs (seed_name)
        VALUES ('02_massive_seed_6M.sql');
      "

      echo "Carga masiva finalizada correctamente."



  # ===========================================================================
  # HU-11 | Frontend Web (Angular 21 / Nginx Alpine) - Multi-stage build
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gamer-frontend:production
    container_name: gamer_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # HU-15 | GLPI Database (MariaDB 10.11) - Mesa de Ayuda ITIL
  # ===========================================================================
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${GLPI_DB_NAME:-glpi_db}
      MYSQL_USER: ${GLPI_DB_USER:-glpi_user}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_password_change_me}
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${GLPI_DB_USER:-glpi_user}", "--password=${GLPI_DB_PASSWORD:-glpi_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # HU-15 | GLPI Helpdesk (GLPI 10 Official) - Gestión de Tickets y Autoservicio
  # ===========================================================================
  glpi:
    image: glpi/glpi:latest
    container_name: glpi-app
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - "${GLPI_PORT:-8080}:80"
    environment:
      TIMEZONE: ${TZ:-America/Argentina/Buenos_Aires}
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi_db}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi_user}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-glpi_password_change_me}
    volumes:
      - glpi_data:/var/glpi
    networks:
      - glpi-network

# =============================================================================
# Volúmenes nombrados con persistencia garantizada
# =============================================================================
volumes:
  backup-data:
  pgdata:
    name: gamer_pgdata
  pgadmin_data:
    name: gamer_pgadmin_data
  glpi_db_data:
    name: glpi_db_data
  glpi_data:
    name: glpi_data

# =============================================================================
# Redes bridge internas segmentadas (Seguridad y Microsegmentación)
# =============================================================================
networks:
  app-network:
    name: gamer_app_network
    driver: bridge
  db-network:
    name: gamer_db_network
    driver: bridge
  glpi-network:
    name: glpi-network
    driver: bridge
