global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'n8n-glpi-webhook'
  routes:
    - matchers:
        - alertname="PatroniMasterFailover"
      receiver: 'n8n-failover-rag-webhook'
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 24h
      continue: false

receivers:
  - name: 'n8n-glpi-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/alerta-infraestructura'
        send_resolved: true

  - name: 'n8n-failover-rag-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/failover-patroni'
        send_resolved: false