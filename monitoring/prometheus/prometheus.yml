global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "patroni-cluster"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "pg-node-1:8008"
          - "pg-node-2:8008"
          - "pg-node-3:8008"
        labels:
          cluster: "gamer-postgres"

  - job_name: "haproxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["gamer-db-proxy:8404"]
